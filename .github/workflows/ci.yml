name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: discovery-service
            # Le serveur Eureka s'appuie sur le client Eureka : il ne doit pas être désactivé ici.
            eureka_client: "true"
          - service: config-server
          - service: Gateway
          - service: auth-service
            database: auth_db
          - service: car-rental-car-service
            database: car_db
          - service: rental-service
            database: rental_db

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      APP_JWT_SECRET: ci-only-secret-key-for-tests-0123456789abcdef
      EUREKA_CLIENT_ENABLED: ${{ matrix.eureka_client || 'false' }}
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/${{ matrix.database || 'ci_db' }}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build et tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construction des images (docker compose build)
        run: APP_JWT_SECRET=ci-only docker compose build
