spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: car-service
              uri: lb://car-service
              predicates:
                - Path=/api/cars/**
              filters:
                - JwtAuth
                - name: DedupeResponseHeader
                  args:
                    name: Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - name: Retry
                  args:
                    retries: 3
                    statuses: INTERNAL_SERVER_ERROR
                    methods: GET,POST,PUT,DELETE,PATCH

            - id: rental-service-rentals
              uri: lb://rental-service
              predicates:
                - Path=/api/rentals/**
              filters:
                - JwtAuth

            - id: rental-service-customers
              uri: lb://rental-service
              predicates:
                - Path=/api/customers/**
              filters:
                - JwtAuth

            - id: rental-service-scheduler
              uri: lb://rental-service
              predicates:
                - Path=/api/scheduler/**
              filters:
                - JwtAuth

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}